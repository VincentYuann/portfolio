    <!-- Zero-flash theme initialization before first paint -->
    <style>
      html, body {
        background-color: #F2E9DA;
      }
      html.dark, html.dark body {
        background-color: #1E1F24;
      }
    </style>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('profolio-theme');
          // Default to Day mode unless explicitly set to night
          var isNight = saved === 'night';
          if (isNight) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#1E1F24';
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#F2E9DA';
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
