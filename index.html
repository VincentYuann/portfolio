    <!-- Zero-flash theme initialization before first paint -->
    <style>
      html, body {
        background-color: #F2E9DA;
      }
      html.dark, html.dark body {
        background-color: #1E1F24;
      }
    </style>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('profolio-theme');
          // Default to Day mode unless explicitly set to night
          var isNight = saved === 'night';
          if (isNight) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#121316';
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#EAE0CE';
            document.documentElement.style.colorScheme = 'light';
          }

          var savedFont = localStorage.getItem('profolio-typography-variant') || 'v4';
          document.documentElement.setAttribute('data-font-variant', savedFont);
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

      />
