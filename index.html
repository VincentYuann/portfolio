<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./stitch/hanko-stamp.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vincent Yuan · Software & AI Engineer (Akari Wabi-Sabi Portfolio)</title>
    <meta name="description" content="Portfolio of Vincent Yuan · Software & AI Engineer. Crafting thoughtful digital experiences with algorithmic clarity and Japanese Wabi-Sabi harmony." />
    
    <!-- Zero-flash theme initialization before first paint -->
    <style>
      html, body {
        background-color: #F2E9DA;
      }
      html.dark, html.dark body {
        background-color: #090A0C;
      }
    </style>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('profolio-theme');
          // Default to Day mode unless explicitly set to night
          var isNight = saved === 'night';
          if (isNight) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#090A0C';
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#F2E9DA';
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- impeccable-disable overused-font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&family=Montserrat:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,500;0,600;1,400&family=Oxanium:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="antialiased selection:bg-terracotta/20 selection:text-terracotta">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
